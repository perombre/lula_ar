<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lula em AR</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root { --bg:#eef1f5; --fg:#14213d; --accent:#1f4fbf; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display:flex; flex-direction:column; }
  header { padding:14px 16px 4px; text-align:center; }
  header h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; font-size:13px; opacity:.7; }
  model-viewer { flex:1; width:100%; min-height:60vh; background:transparent; --poster-color:transparent; }
  .ar { margin:6px 16px calc(16px + env(safe-area-inset-bottom)); }
  .ar-btn { width:100%; border:0; border-radius:14px; padding:16px; font-size:17px; font-weight:600;
    background:var(--accent); color:#fff; }
  .ar-btn[disabled] { opacity:.5; }
  .hint { text-align:center; font-size:12px; opacity:.6; margin-top:6px; }
  .bar { position:absolute; left:0; right:0; top:0; height:3px; }
  .bar div { height:100%; width:0; background:var(--accent); transition:width .2s; }
  /* botões Dançar e Acenar: aparecem na página e continuam dentro do AR */
  .moves { position:absolute; left:50%; transform:translateX(-50%); bottom:16px; display:flex; gap:10px; }
  .moves button { border:0; border-radius:999px; padding:14px 20px; font-size:17px; font-weight:600; white-space:nowrap;
    background:rgba(255,255,255,.95); color:var(--fg); box-shadow:0 4px 16px rgba(0,0,0,.2); min-width:128px; }
  .moves button.on { background:var(--accent); color:#fff; }
  model-viewer[ar-status="session-started"] .moves,
  model-viewer[ar-status="object-placed"] .moves { bottom:calc(32px + env(safe-area-inset-bottom)); }
  /* dentro do AR: sair, esconder botões (para gravar a tela) e área invisível para mostrar de novo */
  .round { position:absolute; top:calc(16px + env(safe-area-inset-top)); width:48px; height:48px; border:0;
    border-radius:50%; background:rgba(255,255,255,.9); color:var(--fg); font-size:22px;
    box-shadow:0 2px 10px rgba(0,0,0,.2); }
  .exit { left:16px; }
  .hide { right:16px; display:none; }
  model-viewer[ar-status="session-started"] .hide,
  model-viewer[ar-status="object-placed"] .hide { display:block; }
  .restore { position:absolute; top:0; right:0; width:96px; height:96px; display:none; }
  model-viewer.clean .moves, model-viewer.clean .round { display:none !important; }
  model-viewer.clean .restore { display:block; }
  .cam-btn { display:block; width:100%; margin-top:10px; border:1px solid #c9d2e3; border-radius:14px;
    padding:14px; font-size:16px; font-weight:600; background:#fff; color:var(--fg); text-align:center;
    text-decoration:none; }
</style>
</head>
<body>
<header>
  <h1>Lula em AR</h1>
  <p>Gire com o dedo e aproxime com pinça</p>
</header>

<model-viewer id="mv"
  src="lula.glb"
  ios-src="lula_danca.usdz"
  alt="Personagem 3D do Lula"
  camera-controls touch-action="pan-y"
  autoplay animation-name="Lula_Idle" animation-crossfade-duration="400"
  ar ar-modes="webxr scene-viewer quick-look" ar-scale="auto" ar-placement="floor"
  shadow-intensity="1" shadow-softness="0.8" exposure="1.05"
  camera-orbit="15deg 80deg 5.4m" camera-target="0.15m 0.85m 0m" min-camera-orbit="auto auto 1.2m" max-camera-orbit="auto auto 8m"
  interaction-prompt="auto">
  <div class="bar" slot="progress-bar"><div id="bar"></div></div>
  <button slot="ar-button" style="display:none"></button>
  <div class="moves" id="moves">
    <button data-anim="Lula_Danca" data-label="💃 Dançar">💃 Dançar</button>
    <button data-anim="Lula_Aceno" data-label="👋 Acenar">👋 Acenar</button>
  </div>
  <button class="round exit" slot="exit-webxr-ar-button" aria-label="Sair do AR">✕</button>
  <button class="round hide" id="hideBtn" aria-label="Esconder botões">🙈</button>
  <div class="restore" id="restore"></div>
</model-viewer>

<div class="ar">
  <button class="ar-btn" id="arBtn">Ver na minha sala (AR)</button>
  <div class="hint" id="hint">Abra no celular para ver em realidade aumentada</div>
  <a class="cam-btn" href="camera.html">📸 Gravar vídeo com o Lula</a>
</div>

<script>
  const mv = document.getElementById('mv');
  const moves = document.getElementById('moves');
  const moveBtns = moves.querySelectorAll('button');
  const arBtn = document.getElementById('arBtn');
  const hint = document.getElementById('hint');

  // cada botão liga o seu movimento; tocar de novo ("Parar") volta ao idle
  moveBtns.forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const next = mv.animationName === b.dataset.anim ? 'Lula_Idle' : b.dataset.anim;
    mv.animationName = next;
    mv.play();
    moveBtns.forEach(o => {
      const active = o.dataset.anim === next;
      o.classList.toggle('on', active);
      o.textContent = active ? 'Parar' : o.dataset.label;
    });
  }));
  // esconder os botões para gravar a tela; tocar no canto superior direito mostra de novo
  const hideBtn = document.getElementById('hideBtn');
  const restore = document.getElementById('restore');
  hideBtn.addEventListener('click', e => { e.stopPropagation(); mv.classList.add('clean'); });
  restore.addEventListener('click', e => { e.stopPropagation(); mv.classList.remove('clean'); });
  mv.addEventListener('ar-status', e => { if (e.detail.status === 'not-presenting') mv.classList.remove('clean'); });

  // no AR, tocar nos botões não deve reposicionar o Lula
  [moves, hideBtn, restore].forEach(el => el.addEventListener('beforexrselect', e => e.preventDefault()));

  mv.addEventListener('progress', e => {
    document.getElementById('bar').style.width = (e.detail.totalProgress * 100) + '%';
    if (e.detail.totalProgress === 1) document.querySelector('.bar').style.display = 'none';
  });

  mv.addEventListener('load', () => {
    if (mv.canActivateAR) {
      hint.textContent = 'Aponte a câmera para o chão e toque para posicionar';
    } else {
      arBtn.disabled = true;
      hint.textContent = 'AR disponível no celular (Chrome no Android, Safari no iPhone)';
    }
  });

  arBtn.addEventListener('click', () => { if (mv.canActivateAR) mv.activateAR(); });
</script>
</body>
</html>
