<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lula · Câmera</title>
<style>
  :root { --fg:#14213d; --accent:#1f4fbf; --rec:#e53935; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:#000; color:#fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action:none; }
  #stage { position:fixed; inset:0; }
  video#cam { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  video#cam.mirror { transform:scaleX(-1); }
  canvas#gl { position:absolute; inset:0; width:100%; height:100%; }
  .top { position:fixed; top:calc(12px + env(safe-area-inset-top)); left:12px; right:12px;
    display:flex; justify-content:space-between; align-items:center; pointer-events:none; }
  .top > * { pointer-events:auto; }
  .round { width:46px; height:46px; border:0; border-radius:50%; background:rgba(0,0,0,.45); color:#fff;
    font-size:20px; display:flex; align-items:center; justify-content:center; text-decoration:none; }
  .timer { padding:6px 12px; border-radius:999px; background:var(--rec); font-weight:600; font-size:15px; display:none; }
  .bottom { position:fixed; left:0; right:0; bottom:calc(20px + env(safe-area-inset-bottom));
    display:flex; align-items:center; justify-content:center; gap:22px; }
  .pill { border:0; border-radius:999px; padding:12px 18px; font-size:16px; font-weight:600;
    background:rgba(255,255,255,.92); color:var(--fg); min-width:110px; }
  .rec { width:76px; height:76px; border-radius:50%; border:5px solid #fff; background:transparent; padding:0; }
  .rec span { display:block; margin:auto; width:56px; height:56px; border-radius:50%; background:var(--rec); transition:all .2s; }
  .rec.on span { width:28px; height:28px; border-radius:6px; }
  .hint { position:fixed; left:0; right:0; bottom:calc(118px + env(safe-area-inset-bottom)); text-align:center;
    font-size:13px; text-shadow:0 1px 3px rgba(0,0,0,.8); opacity:.9; }
  .msg { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:24px;
    text-align:center; background:rgba(0,0,0,.6); font-size:16px; }
  .msg[hidden] { display:none; }
  #result { position:fixed; inset:0; background:#111; display:none; flex-direction:column; }
  #result video { flex:1; width:100%; min-height:0; object-fit:contain; background:#000; }
  #result .actions { display:flex; gap:10px; padding:14px 16px calc(14px + env(safe-area-inset-bottom)); }
  #result .actions > * { flex:1; text-align:center; text-decoration:none; }
  .primary { background:var(--accent) !important; color:#fff !important; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage">
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="gl"></canvas>
</div>

<div class="top">
  <a class="round" href="index.html" aria-label="Voltar">←</a>
  <div class="timer" id="timer">● 0:00</div>
  <button class="round" id="flip" aria-label="Trocar câmera">🔄</button>
</div>

<div class="hint" id="hint">Arraste para mover · pinça para aumentar · dois dedos para girar</div>

<div class="bottom">
  <button class="pill" id="dance">💃 Dançar</button>
  <button class="rec" id="rec" aria-label="Gravar"><span></span></button>
  <div style="min-width:110px"></div>
</div>

<div class="msg" id="msg">Carregando o Lula…</div>

<div id="result">
  <video id="playback" playsinline controls loop></video>
  <div class="actions">
    <button class="pill" id="again">Gravar de novo</button>
    <a class="pill" id="save" download>Salvar</a>
    <button class="pill primary" id="share">Compartilhar</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const $ = id => document.getElementById(id);
const cam = $('cam'), gl = $('gl'), msg = $('msg');

// ---------- cena 3D ----------
const renderer = new THREE.WebGLRenderer({ canvas: gl, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
const camera3d = new THREE.PerspectiveCamera(38, 1, 0.1, 50);
camera3d.position.set(0, 1.0, 5.6);
camera3d.lookAt(0, 0.85, 0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(2, 4, 3); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.8); fill.position.set(-3, 2, -2); scene.add(fill);

// sombra suave no chão
const shadowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'); const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, 'rgba(0,0,0,0.45)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c);
})();

const holder = new THREE.Group(); scene.add(holder);
holder.position.x = -0.15;   // a dança anda para a direita; começa um pouco à esquerda
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 0.7), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }));
shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.005; holder.add(shadow);

let mixer, actions = {}, current = 'Lula_Idle', model;
const draco = new DRACOLoader(); draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
const loader = new GLTFLoader(); loader.setDRACOLoader(draco);
loader.load('lula.glb', gltf => {
  model = gltf.scene; holder.add(model);
  mixer = new THREE.AnimationMixer(model);
  gltf.animations.forEach(c => actions[c.name] = mixer.clipAction(c));
  actions[current]?.play();
  msg.hidden = true;
}, undefined, () => { msg.textContent = 'Não foi possível carregar o modelo.'; });

function setAnim(name) {
  if (!actions[name] || name === current) return;
  const next = actions[name], prev = actions[current];
  next.reset().play(); prev.crossFadeTo(next, 0.4, false);
  current = name;
}
$('dance').onclick = () => {
  const dancing = current === 'Lula_Danca';
  setAnim(dancing ? 'Lula_Idle' : 'Lula_Danca');
  $('dance').textContent = dancing ? '💃 Dançar' : 'Parar';
};

// ---------- câmera do celular ----------
let facing = 'environment', stream;
async function startCam() {
  stream?.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    cam.srcObject = stream; await cam.play();
    cam.classList.toggle('mirror', facing === 'user');
  } catch (e) {
    msg.hidden = false;
    msg.textContent = 'Permita o acesso à câmera para gravar com o Lula. (Você ainda pode ver o Lula aqui.)';
    setTimeout(() => { if (model) msg.hidden = true; }, 3500);
  }
}
$('flip').onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; startCam(); };
startCam();

// ---------- gestos: arrastar move, pinça aumenta, dois dedos giram ----------
const pts = new Map(); let last = null;
function screenToWorldDelta(dx, dy) {
  const dist = camera3d.position.distanceTo(holder.position.clone().setY(0.85));
  const h = 2 * Math.tan(THREE.MathUtils.degToRad(camera3d.fov / 2)) * dist;
  return [dx / innerHeight * h, -dy / innerHeight * h];
}
gl.addEventListener('pointerdown', e => { gl.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); last = null; });
gl.addEventListener('pointerup', e => { pts.delete(e.pointerId); last = null; });
gl.addEventListener('pointercancel', e => { pts.delete(e.pointerId); last = null; });
gl.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  const prev = pts.get(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 1) {
    const [wx, wy] = screenToWorldDelta(e.clientX - prev[0], e.clientY - prev[1]);
    holder.position.x += wx; holder.position.y += wy;
  } else if (pts.size === 2) {
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]), ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
    if (last) {
      const s = THREE.MathUtils.clamp(holder.scale.x * d / last.d, 0.2, 4);
      holder.scale.setScalar(s);
      holder.rotation.y -= ang - last.ang;
    }
    last = { d, ang };
  }
});
gl.addEventListener('wheel', e => {   // zoom no computador
  holder.scale.setScalar(THREE.MathUtils.clamp(holder.scale.x * (e.deltaY < 0 ? 1.08 : 0.93), 0.2, 4));
}, { passive: true });

// ---------- gravação: junta câmera + Lula num canvas e grava ----------
const comp = document.createElement('canvas'); const ctx = comp.getContext('2d');
let recorder, chunks = [], recording = false, t0 = 0, blobUrl, fileOut;
function pickType() {
  const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  return types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
}
function sizeComp() {
  const scale = Math.min(1, 1080 / Math.min(innerWidth, innerHeight) / devicePixelRatio) * devicePixelRatio;
  comp.width = Math.round(innerWidth * scale / 2) * 2; comp.height = Math.round(innerHeight * scale / 2) * 2;
}
function drawComposite() {
  const W = comp.width, H = comp.height;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (cam.videoWidth) {   // mesmo enquadramento "cover" da tela
    const s = Math.max(W / cam.videoWidth, H / cam.videoHeight);
    const w = cam.videoWidth * s, h = cam.videoHeight * s;
    ctx.save();
    if (facing === 'user') { ctx.translate(W, 0); ctx.scale(-1, 1); }
    ctx.drawImage(cam, (W - w) / 2, (H - h) / 2, w, h);
    ctx.restore();
  }
  ctx.drawImage(gl, 0, 0, W, H);
}
$('rec').onclick = () => recording ? stopRec() : startRec();
function startRec() {
  const type = pickType();
  if (!type) { alert('Este navegador não consegue gravar vídeo.'); return; }
  sizeComp(); chunks = [];
  recorder = new MediaRecorder(comp.captureStream(30), { mimeType: type, videoBitsPerSecond: 6_000_000 });
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = showResult;
  recorder.start(250); recording = true; t0 = performance.now();
  $('rec').classList.add('on'); $('timer').style.display = 'block'; $('hint').style.display = 'none';
}
function stopRec() {
  recording = false; recorder.stop();
  $('rec').classList.remove('on'); $('timer').style.display = 'none'; $('hint').style.display = '';
}
function showResult() {
  const type = recorder.mimeType || 'video/webm';
  const ext = type.includes('mp4') ? 'mp4' : 'webm';
  const blob = new Blob(chunks, { type });
  if (blobUrl) URL.revokeObjectURL(blobUrl);
  blobUrl = URL.createObjectURL(blob);
  fileOut = new File([blob], `lula.${ext}`, { type });
  $('playback').src = blobUrl; $('save').href = blobUrl; $('save').download = `lula.${ext}`;
  $('share').style.display = navigator.canShare?.({ files: [fileOut] }) ? '' : 'none';
  $('result').style.display = 'flex'; $('playback').play();
}
$('again').onclick = () => { $('result').style.display = 'none'; $('playback').pause(); };
$('share').onclick = async () => {
  try { await navigator.share({ files: [fileOut], title: 'Lula', text: 'Olha o Lula dançando! 💃' }); } catch (e) {}
};

// ---------- loop ----------
const clock = new THREE.Clock();
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera3d.aspect = innerWidth / innerHeight; camera3d.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
renderer.setAnimationLoop(() => {
  mixer?.update(clock.getDelta());
  renderer.render(scene, camera3d);
  if (recording) {
    drawComposite();
    const s = Math.floor((performance.now() - t0) / 1000);
    $('timer').textContent = `● ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    if (s >= 60) stopRec();   // limite de 1 minuto
  }
});
</script>
</body>
</html>
